<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automio · CYTECMA</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#101828;--mut:#667085;--line:#eaecf0;--acc:#155eef;--acc-soft:#eff4ff;--ok:#067647;--ok-soft:#dcfae6;--warn:#b54708;--warn-soft:#fef0c7;--bad:#b42318;--bad-soft:#fee4e2;--vio:#6941c6;--vio-soft:#f4ebff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13.5px/1.45 "Inter",-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;-webkit-font-smoothing:antialiased}
nav{width:232px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;min-height:100vh;position:sticky;top:0}
nav .brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px}
nav .brand img{height:24px}
nav .brand .am{font-size:10px;color:#98a2b3;letter-spacing:.12em;text-transform:uppercase}
nav .sect{font-size:10.5px;color:#98a2b3;letter-spacing:.08em;text-transform:uppercase;padding:12px 18px 4px}
nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:8px 10px;color:#344054;text-decoration:none;font-size:13px;border-radius:8px;transition:background .12s}
nav a svg{color:#667085;flex-shrink:0}
nav a:hover{background:#f2f4f7}
nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
nav a.on svg{color:var(--acc)}
nav a .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:10.5px;padding:0 6px;line-height:17px;font-weight:600}
nav .foot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
nav .user{display:flex;gap:10px;align-items:center;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
nav .user .nm{font-size:12.5px;font-weight:600}nav .user .rl{font-size:11px;color:var(--mut)}
nav .demo-note{font-size:10px;color:#98a2b3;margin-top:8px;text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header .crumb{color:var(--mut);font-size:12px;margin-top:1px}
header h1{font-size:17px;margin:0;font-weight:700}
.search{margin-left:auto;display:flex;align-items:center;gap:7px;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:280px;color:#98a2b3;transition:border .12s}
.search:focus-within{border-color:var(--acc)}
.search input{border:0;outline:0;background:none;font-size:12.5px;width:100%;color:var(--ink)}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#667085;cursor:pointer}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.avt{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.badge-demo{background:var(--warn-soft);color:#93370d;border:1px solid #fedf89;border-radius:6px;font-size:10px;padding:3px 8px;font-weight:700;letter-spacing:.06em}
.content{padding:22px 24px 48px;max-width:1280px;width:100%;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 14px rgba(16,24,40,.06)}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.kpi .l{font-size:11.5px;color:var(--mut)}
.kpi .v{font-size:23px;font-weight:700;margin:1px 0 2px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.8fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;overflow-x:auto}
.card h3{margin:0 0 12px;font-size:13.5px;display:flex;align-items:center;gap:8px;font-weight:700}
.card h3 .more{margin-left:auto;font-size:11.5px;color:var(--acc);font-weight:600;cursor:pointer}
.card h3 .sub{font-weight:400;color:var(--mut);font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
th{text-align:left;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f2f4f7;vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover td{background:#f9fafb;cursor:pointer}
tr.sel td{background:var(--acc-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-wn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-inf{background:var(--acc-soft);color:var(--acc)}.p-mut{background:#f2f4f7;color:var(--mut)}
.mono{font-variant-numeric:tabular-nums;font-size:12.2px;color:var(--mut)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px;color:#344054;cursor:pointer;display:flex;gap:6px;align-items:center;transition:all .12s}
.fchip:hover{border-color:#d0d5dd}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:600;transition:background .12s}
.btn:hover{background:#0e4fd6}
.btn.ghost{background:#fff;color:#344054;border:1px solid #d0d5dd}
.btn.ghost:hover{background:#f9fafb}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecdca}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:7px}
.chk{appearance:none;width:15px;height:15px;border:1.5px solid #d0d5dd;border-radius:4px;cursor:pointer;position:relative;vertical-align:middle;transition:all .12s;background:#fff}
.chk:checked{background:var(--acc);border-color:var(--acc)}
.chk:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.bulkbar{position:sticky;bottom:16px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:12.5px;box-shadow:0 10px 26px rgba(16,24,40,.25);margin-top:10px;animation:rise .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bulkbar .bb{background:#26314a;color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
.pgfooter{display:flex;align-items:center;gap:8px;padding:10px 4px 0;font-size:12px;color:var(--mut)}
.pgfooter .pb{margin-left:auto;display:flex;gap:6px}
.pgfooter .pb button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 11px;font-size:12px;color:#344054;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,96vw);background:#fff;box-shadow:-14px 0 44px rgba(16,24,40,.16);z-index:20;transform:translateX(105%);transition:transform .24s cubic-bezier(.32,.72,.28,1);overflow-y:auto}
.drawer.open{transform:none}
.drawer .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 20px;display:flex;align-items:center;gap:10px;z-index:2}
.drawer .dh h2{margin:0;font-size:15px}
.drawer .db{padding:16px 20px 48px}
.x{margin-left:auto;border:0;background:#f2f4f7;border-radius:7px;width:28px;height:28px;cursor:pointer;color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:12.8px;margin-bottom:12px}
.kv .k{color:var(--mut)}
.timeline{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:16px}
.timeline .ev{position:relative;margin-bottom:12px;font-size:12.5px}
.timeline .ev::before{content:"";position:absolute;left:-22.5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.timeline .ev .t{color:var(--mut);font-size:11px}
.alertc{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f2f4f7;font-size:12.5px}
.alertc:last-child{border:0}
.alertc .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feed .it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f2f4f7;font-size:12.5px}
.feed .it:last-child{border:0}
.feed .ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.prog{height:6px;background:#eaecf0;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.risk-tag{color:var(--bad);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.sla{font-size:11px;font-weight:600;padding:2px 8px;border-radius:14px;white-space:nowrap}
.sla.over{background:var(--bad-soft);color:var(--bad)}
.sla.soon{background:var(--warn-soft);color:var(--warn)}
.sla.fine{background:#f2f4f7;color:var(--mut)}
.req{display:inline-flex;align-items:center;gap:7px}
.req .ra{width:24px;height:24px;border-radius:50%;background:#e0eaff;color:#3538cd;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.hero{background:linear-gradient(135deg,#155eef,#0b3fa8 60%,#0a3385);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .l{font-size:11.5px;opacity:.8}
.hero .v{font-size:27px;font-weight:700;margin:3px 0 8px;letter-spacing:-.01em}
.hero svg{display:block;width:100%}
.hero .sub{font-size:11px;opacity:.75;margin-top:6px}
.mail{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-top:10px}
.mail .mh{color:var(--mut);font-size:11px;margin-bottom:6px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.sup{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.sup .sc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:all .15s}
.sup .sc:hover{border-color:#b2ccff;box-shadow:0 4px 14px rgba(16,24,40,.06);transform:translateY(-1px)}
.sc h4{margin:0 0 2px;font-size:13.5px}.sc .cat{color:var(--mut);font-size:11.5px;margin-bottom:9px}
.spark{display:flex;gap:3px;align-items:flex-end;height:32px;margin-top:9px}
.spark i{flex:1;background:#d1e0ff;border-radius:2px;transition:height .3s}
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut-legend{font-size:12px;display:flex;flex-direction:column;gap:7px}
.donut-legend .li{display:flex;align-items:center;gap:8px}
.donut-legend .sw{width:9px;height:9px;border-radius:3px}
.donut-legend .pc{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty .eic{width:44px;height:44px;border-radius:12px;background:#f2f4f7;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;color:#98a2b3}
.mob-hdr{display:none}
@media(max-width:880px){
 body{flex-direction:column}
 nav{display:none}
 .mob-hdr{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
 .mob-hdr img{height:22px}
 .mob-hdr select{margin-left:auto;background:#f9fafb;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
 .grid2{grid-template-columns:1fr}
 .search{width:140px}
 .content{padding:14px}
 header{padding:10px 14px;flex-wrap:wrap}
 .hide-m{display:none}
 .drawer{width:100vw}
 table{min-width:560px}
}

function bars(vals){const h=Math.max(...vals);return `<div class="spark">${vals.map(v=>`<i style="height:${Math.round(v/h*100)}%"></i>`).join("")}</div>`}
function areaChart(data,w=560,h=170){const max=Math.max(...data.map(d=>d[1]))*1.15,gap=w/(data.length-1);
let pts=data.map((d,i)=>[i*gap,h-10-(d[1]/max)*(h-30)]);
let line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
let area=line+` L${w},${h} L0,${h} Z`;
let dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#155eef" stroke-width="2"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10" font-weight="600" fill="#101828">${data[i][1]}</text>`).join("");
let labels=data.map((d,i)=>`<text x="${i*gap}" y="${h+16}" text-anchor="middle" font-size="10" fill="#667085">${d[0]}</text>`).join("");
return `<svg class="chart" viewBox="-20 0 ${w+40} ${h+26}" style="width:100%"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#155eef" stop-opacity=".22"/><stop offset="100%" stop-color="#155eef" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#155eef" stroke-width="2.2" stroke-linecap="round"/>${dots}${labels}</svg>`}
function donut(data,size=150){const tot=data.reduce((a,d)=>a+d[1],0),r=size/2-9,c=2*Math.PI*r;let off=0,seg="";
data.forEach(d=>{const len=d[1]/tot*c;seg+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${d[2]}" stroke-width="15" stroke-dasharray="${len-2} ${c-len+2}" stroke-dashoffset="${-off}" stroke-linecap="round" style="transition:stroke-dasharray .6s"/>`;off+=len});
return `<div class="donut-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${size/2} ${size/2})">${seg}</g><text x="50%" y="47%" text-anchor="middle" font-size="19" font-weight="700" fill="#101828">${(tot/1000).toFixed(1)}k€</text><text x="50%" y="60%" text-anchor="middle" font-size="10" fill="#667085">6 meses</text></svg><div class="donut-legend">${data.map(d=>`<div class="li"><span class="sw" style="background:${d[2]}"></span>${d[0]}<span class="pc">${Math.round(d[1]/tot*100)}%</span></div>`).join("")}</div></div>`}
function svgBars(data,labels,color){const w=560,h=150,bw=w/data.length*.55,gap=w/data.length;let s=`<svg class="chart" viewBox="0 0 ${w} ${h+26}" style="width:100%">`;
data.forEach((v,i)=>{const bh=v/Math.max(...data)*(h-16);s+=`<rect x="${i*gap+(gap-bw)/2}" y="${h-bh}" width="${bw}" height="${bh}" rx="5" fill="${color}"/><text x="${i*gap+gap/2}" y="${h+16}" text-anchor="middle" font-size="10" fill="#667085">${labels[i]}</text><text x="${i*gap+gap/2}" y="${h-bh-5}" text-anchor="middle" font-size="10" fill="#101828" font-weight="600">${v}</text>`});return s+"</svg>"}

function vAct(){view.innerHTML=`<div class="card"><div class="feed">${FEED.map(f=>`<div class="it"><div class="ic" style="background:${f[0]};color:#344054">${f[1]}</div><div>${f[2]}<br><span class="mono">${f[3]}</span></div></div>`).join("")}</div></div>`}
/* ---------- Buscar ---------- */
function dosearch(v){if(cur==="compras"){vCompras();return}
if(!v){closeDrawer();return}const q=v.toLowerCase();const hits=[];
ORD.forEach(o=>{if((o.id+o.sup+o.item+o.proj).toLowerCase().includes(q))hits.push(["Pedido "+o.id,o.sup+" — "+o.item,`openOrder('${o.id}')`])});
PROJ.forEach(p=>{if((p.id+p.name+p.cli).toLowerCase().includes(q))hits.push(["Proyecto "+p.id,p.name,`openProj('${p.id}')`])});

openDrawer(`Resultados para “${v}”`,hits.length?hits.map(h=>`<div class="feed it" style="cursor:pointer" onclick="${h[2]}"><div class="ic" style="background:var(--acc-soft);color:var(--acc)">${ICO.eye}</div><div><b>${h[0]}</b><br><span class="mono">${h[1]}</span></div></div>`).join(""):`<div class="empty"><div class="eic">${ICO.compras}</div><div><b>Sin resultados para “${v}”</b><br>Prueba con un número de pedido, proyecto o proveedor.</div></div>`)}
go(location.hash.slice(1) || "panel");
